spring.application.name=respawn-api

# Porta: o Render informa a porta pela variavel PORT; localmente usa 8080.
server.port=${PORT:8080}

# Banco Oracle da FIAP. Usuario e senha NUNCA ficam no codigo:
# localmente vem do arquivo .env (veja .env.example); no Render, das Environment Variables.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Poucas conexoes: o Oracle da FIAP limita as sessoes por aluno.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Documentacao interativa (Swagger UI)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
